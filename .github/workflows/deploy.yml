name: CI/CD Production - Sécurisé (Trivy)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bbabadara/learning-platform
  TAG: main
  DATABASE_URL: postgresql://ci:ci@ci:5432/ci?sslmode=disable

jobs:
  ci:
    name: Lint + Typecheck + Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Trivy FS scan (vulnérabilités dépendances)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy FS results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs.sarif'

      - name: Trivy Config scan (Dockerfile + IaC)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy Config results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-config.sarif'

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  sonarqube:
    name: Analyse SonarQube
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Scan SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Build + Trivy scan + push image (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image (local pour scan Trivy)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            local-scan:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}

      - name: Trivy Image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'local-scan:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy Image results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image.sarif'

      - name: Push image vers GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}

  deploy:
    name: Déploiement production (SSH)
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.PROD_HOST }}
          username: ${{ vars.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/prod

            echo "== Application du schéma Prisma (base du serveur) =="
            docker compose -f docker-compose.yml --env-file .env --profile app run --rm migrate

            echo "== Pull + démarrage de l'app =="
            docker compose -f docker-compose.yml --env-file .env --profile app pull app
            docker compose -f docker-compose.yml --env-file .env --profile app up -d app

            echo "Attente du healthcheck du conteneur app..."
            for i in $(seq 1 40); do
              status=$(docker inspect --format '{{.State.Health.Status}}' learning-platform 2>/dev/null || echo "absent")
              if [ "$status" = "healthy" ]; then
                echo "App saine."
                break
              fi
              echo "  ... ($i) statut: $status"
              sleep 5
            done

            if [ "$status" != "healthy" ]; then
              echo "L'application n'est pas saine, affichage des logs :"
              docker compose -f docker-compose.yml --env-file .env --profile app logs --tail 100 app
              exit 1
            fi

            docker compose -f docker-compose.yml --env-file .env --profile app ps