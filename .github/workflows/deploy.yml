name: CI/CD Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bbabadara/learning-platform
  TAG: main

jobs:
  ci:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  sonarqube:
    name: Analyse SonarQube
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Scan SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Build + push image (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}

  deploy:
    name: Déploiement production (SSH)
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.PROD_HOST }}
          username: ${{ vars.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/prod

            echo "== Application du schéma Prisma (base du serveur) =="
            docker compose -f docker-compose.yml --env-file .env --profile app run --rm migrate

            echo "== Pull + démarrage de l'app =="
            docker compose -f docker-compose.yml --env-file .env --profile app pull app
            docker compose -f docker-compose.yml --env-file .env --profile app up -d app

            echo "Attente du healthcheck du conteneur app..."
            for i in $(seq 1 40); do
              status=$(docker inspect --format '{{.State.Health.Status}}' learning-platform 2>/dev/null || echo "absent")
              if [ "$status" = "healthy" ]; then
                echo "App saine."
                break
              fi
              echo "  ... ($i) statut: $status"
              sleep 5
            done

            if [ "$status" != "healthy" ]; then
              echo "L'application n'est pas saine, affichage des logs :"
              docker compose -f docker-compose.yml --env-file .env --profile app logs --tail 100 app
              exit 1
            fi

            docker compose -f docker-compose.yml --env-file .env --profile app ps